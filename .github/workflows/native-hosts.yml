name: Native host checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-hosts:
    # This runner needs the real Desktop app, CLI, Python PTY support, and a GUI session.
    runs-on: [self-hosted, macOS, opencode-desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.6
      - run: bun install --frozen-lockfile
      - run: bun run bundle
      - run: bun run test:installed
